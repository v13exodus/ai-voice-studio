<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice-Over Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --color-background: #110f1e;
      --color-surface: #1a1829;
      --color-surface-variant: #242238;
      --color-surface-hover: #3c3a52;
      --color-primary: #ffd700; /* Gold */
      --color-secondary: #ff00ff; /* Magenta */
      --color-border: #4a476b;
      --color-text-primary: #ffffff;
      --color-text-secondary: #c0c0c0;
      --color-error: #ff7878;

      --font-primary: 'Playfair Display', serif;
      --font-secondary: 'Inter', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-secondary);
      background-color: var(--color-background);
      color: var(--color-text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    #root {
      width: 100vw;
      height: 100vh;
    }
    
    .particle-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
        background-size: 20px 20px;
        animation: particle-animation 60s linear infinite;
    }

    @keyframes particle-animation {
        from { background-position: 0 0; }
        to { background-position: -1000px 500px; }
    }

    h1, h2, h3 {
      font-family: var(--font-primary);
      color: var(--color-primary);
    }
    
    button {
      font-family: var(--font-secondary);
      font-weight: 600;
      font-size: 1rem;
      padding: 0.8rem 1.5rem;
      border-radius: 50px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    button:not(.secondary) {
      background: linear-gradient(45deg, #ffd700, #f0c400);
      color: #110f1e;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
    }

    button:not(.secondary):hover {
      box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
      transform: translateY(-2px);
    }
    
    button.secondary {
        background-color: transparent;
        color: var(--color-primary);
        border: 2px solid var(--color-primary);
    }
    
    button.secondary:hover {
        background-color: var(--color-primary);
        color: var(--color-background);
    }

    textarea, input[type="text"] {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      color: var(--color-text-primary);
      padding: 0.8rem 1rem;
      border-radius: 8px;
      width: 100%;
      font-family: var(--font-secondary);
      font-size: 1rem;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    textarea:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.3);
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0",
    "vite": "https://aistudiocdn.com/vite@^7.1.12",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.0"
  }
}
</script>
</head>
<body>
  <div class="particle-background"></div>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
